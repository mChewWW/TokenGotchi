[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokengotchi"
version = "1.29.0"
description = "A Tamagotchi-style virtual pet that lives on your Claude Code token usage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
    "watchdog>=4.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
tokengotchi = "tokengotchi.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tokengotchi --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
